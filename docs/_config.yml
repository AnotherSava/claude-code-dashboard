title: Claude Code Dashboard
description: A live monitor for your Claude Code sessions.
remote_theme: just-the-docs/just-the-docs
baseurl: /claude-code-dashboard
plugins:
  - jekyll-remote-theme
color_scheme: light
search_enabled: true
heading_anchors: true

# Render ```mermaid code blocks client-side (just-the-docs built-in support).
mermaid:
  version: "11.4.1"

# Setting `exclude` replaces Jekyll's defaults rather than adding to them, so the
# list it ships with is repeated here. Without them a local `bundle install` puts
# a whole gem tree under `docs/vendor/`, which Jekyll then tries to render as
# site content — and `Gemfile` and `Gemfile.lock` get published alongside it.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - plans/
  - screenshots/check-figures.py
  - screenshots/capture/
