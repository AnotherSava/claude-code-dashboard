[package]
name = "claude-code-dashboard"
version = "1.12.0"
description = "Claude Code Dashboard - always-on-top widget for tracking AI coding agents"
authors = ["Oleg Savelyev"]
edition = "2021"

[lib]
name = "claude_code_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
# Not imported anywhere — declared solely to add one feature to the rustls that
# reqwest already pulls in. reqwest asks for rustls with `default-features =
# false, features = ["std", "tls12"]`, which leaves X25519MLKEM768 offered but
# ranked last, so every full handshake to api.anthropic.com /
# console.anthropic.com / api.telegram.org (all three negotiate it today) costs
# a HelloRetryRequest round trip. Cargo unifies features additively, so naming
# `prefer-post-quantum` here promotes the hybrid group to first choice and drops
# that extra round trip. Keep the version in step with reqwest's own pin.
rustls = { version = "0.23.4", default-features = false, features = ["prefer-post-quantum"] }
async-trait = "0.1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
open = "5"
fontdue = "0.9"
