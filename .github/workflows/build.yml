name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # No NASM step on purpose — see the note in release.yml: aws-lc-sys ships
      # pre-assembled Windows objects, and installing an assembler is what
      # stopped it using them.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm run check

      # A warning fails this. `cargo test` compiles only the test cfg, so a
      # warning in the plain build never reaches it; `--all-targets` compiles both
      # cfgs and all three targets — lib, the bin, and `build.rs`. Each leg of the
      # matrix is also the only thing that sees the other platform's unreachable
      # code: the cluster behind `observe_caption` is live on Windows and dead on
      # macOS. Mirrored in `.claude/commit-checks.sh`, which must keep running the
      # same commands in the same order and carries the full reasoning.
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets
        env:
          RUSTFLAGS: -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - run: npm run build
