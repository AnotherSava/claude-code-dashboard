name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # aws-lc-sys (pulled in by reqwest's rustls/aws-lc-rs backend) needs NASM
      # to assemble its crypto on the Windows MSVC target; no-op elsewhere.
      - name: Install NASM (Windows, for aws-lc-sys)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm run check

      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - run: npm run build
