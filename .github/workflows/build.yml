name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # No NASM step on purpose — see the note in release.yml: aws-lc-sys ships
      # pre-assembled Windows objects, and installing an assembler is what
      # stopped it using them.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm run check

      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - run: npm run build
