name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # No NASM step on purpose. aws-lc-sys ships pre-assembled Windows objects
      # and rustls turns them on for us (its `aws_lc_rs` feature pulls
      # `aws-lc-rs/prebuilt-nasm`), but the builder only falls back to them when
      # it finds no assembler — "if a NASM assembler is detected in your build
      # environment, it is always used". Installing NASM was therefore the one
      # thing forcing the slower assemble-from-source path, and the action doing
      # it was also the workflow's last Node-20 dependency.
      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Marks this as the build people download, which `build.rs` turns into
          # a compile-time flag. It is set here rather than inferred from `CI`
          # because the question is "is this binary going to strangers", and this
          # workflow is the only thing that ships one — `build.yml` produces no
          # installer. Alert defaults that are useful when you built the binary
          # yourself are unwelcome on a fresh install; see `config::TelegramConfig`.
          CCDASH_RELEASE_BUILD: "1"
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v-{0}', github.sha) }}
          # Title = just the version tag (e.g. "v1.6.3"). The product name is
          # redundant on the repo's own releases page and, in the narrow release
          # sidebar, its prefix truncates off the version — the one distinguishing
          # part. GitHub defaults an unset name to the tag anyway.
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            See the [installation guide](https://anothersava.github.io/claude-code-dashboard/pages/install) for downloads, system requirements, and the macOS first-launch workaround.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
