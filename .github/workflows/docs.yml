name: Docs

# Its own job rather than a step in `build.yml`: that workflow is a two-OS
# matrix provisioning a Rust toolchain and a Node toolchain, and this reads some
# JSON and some PNGs. Folding it in would run it twice, on the two machines
# least suited to it, behind a Rust build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      # Full history: `check-figures.py` resolves each figure's `verifiedAt` sha
      # against the repository, and checkout's default depth of 1 leaves only the
      # tip commit — so every entry reported "is not a commit in this repository"
      # and the job failed on three consecutive pushes while the identical script
      # passed locally. Fixing it here rather than making the script shrug at an
      # unresolvable sha, which would disarm the check exactly where it runs
      # unattended.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: pip install pillow pyyaml
      - run: python docs/screenshots/check-figures.py
